name: Build Android APK (Controller Only & Fixed FPS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Android NDK r21e
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git libusb-1.0-0-dev libsdl2-dev python3 libaudiofile-dev bsdmainutils

      - name: Setup Base ROM
        run: |
          if [ -f "./baserom.us.z64" ]; then
            cp ./baserom.us.z64 ./app/jni/src/baserom.us.z64
            echo "ROM posicionada com sucesso."
          else
            echo "ERRO: baserom.us.z64 nao encontrada na raiz!"
            exit 1
          fi

      - name: Strip Touch Buttons & Fix 120Hz
        run: |
          # 1. Neutraliza a renderização de botões nos fontes C/C++
          # Substitui a função que desenha os botões touch por uma função vazia
          find app/jni/src -name "*touch*" -type f -exec sed -i 's/void render_touch_controls(void) {/void render_touch_controls(void) { return;/g' {} + || true
          find app/jni/src -name "*touch*" -type f -exec sed -i 's/void render_touch_controls()/void render_touch_controls() { return; } \/\//g' {} + || true
          find app/jni/src -name "*touch*" -type f -exec sed -i 's/void touch_controls_render(void) {/void touch_controls_render(void) { return;/g' {} + || true

          # 2. Neutraliza na chamada gráfica principal caso exista
          find app/jni/src/pc/gfx -type f -exec sed -i 's/render_touch_controls();/\/\/ render_touch_controls();/g' {} + || true

          # 3. Mantém a correção de 120Hz (desativa VSYNC destravado)
          find app/jni/src -name "gfx_sdl2.c" -exec sed -i 's/SDL_RENDERER_PRESENTVSYNC/0/g' {} + || true

      - name: Get SDL Sources
        run: |
          chmod +x ./getSDL.sh
          ./getSDL.sh

      - name: Build SM64 Native Core
        run: |
          cd app/jni/src
          make --jobs $(nproc)
          cd ../../..

      - name: Build Android APK via Gradle
        run: |
          chmod +x gradlew
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
          export NDK="${ANDROID_NDK_ROOT}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm64-android-gamepad-clean
          path: app/build/outputs/apk/debug/*.apk
