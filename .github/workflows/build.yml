name: Build Android APK (Controller Only & Fixed FPS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Android NDK r21e
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git libusb-1.0-0-dev libsdl2-dev python3 libaudiofile-dev bsdmainutils

      - name: Setup Base ROM
        run: |
          if [ -f "./baserom.us.z64" ]; then
            cp ./baserom.us.z64 ./app/jni/src/baserom.us.z64
            echo "ROM posicionada com sucesso."
          else
            echo "ERRO: baserom.us.z64 nao encontrada na raiz!"
            exit 1
          fi

      - name: Fix Manifest for Modern Android & Remove Touch
        run: |
          # 1. Corrige a exigência do android:exported="true" no AndroidManifest.xml
          find app/src/main -name "AndroidManifest.xml" -exec sed -i 's/<activity /<activity android:exported="true" /g' {} +

          # 2. Atualiza targetSdkVersion para 31 para compatibilidade com Android moderno
          find app -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 31/g' {} +

          # 3. Zera completamente a opacidade dos botoes touch em C/C++
          find app/jni/src -name "*touch*.c" -exec sed -i 's/alpha = [0-9.]\+/alpha = 0.0f/g' {} + || true
          find app/jni/src -name "*touch*.h" -exec sed -i 's/alpha = [0-9.]\+/alpha = 0.0f/g' {} + || true
          find app/jni/src -name "*touch*.c" -exec sed -i 's/opacity = [0-9.]\+/opacity = 0.0f/g' {} + || true

          # 4. Remove a chamada de desenho dos botoes touch
          find app/jni/src/pc/gfx -type f -exec sed -i 's/render_touch_controls();/\/\/ render_touch_controls();/g' {} + || true

          # 5. Mantém a trava de 120Hz para evitar velocidade acelerada
          find app/jni/src -name "gfx_sdl2.c" -exec sed -i 's/SDL_RENDERER_PRESENTVSYNC/0/g' {} + || true

      - name: Get SDL Sources
        run: |
          chmod +x ./getSDL.sh
          ./getSDL.sh

      - name: Build SM64 Native Core
        run: |
          cd app/jni/src
          make --jobs $(nproc)
          cd ../../..

      - name: Build Android APK via Gradle
        run: |
          chmod +x gradlew
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
          export NDK="${ANDROID_NDK_ROOT}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm64-android-gamepad-clean
          path: app/build/outputs/apk/debug/*.apk
